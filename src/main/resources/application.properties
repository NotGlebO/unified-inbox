spring.application.name=unified-inbox

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/unified_inbox}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# Server
server.port=${PORT:8080}

# Security
app.encryption.key=${APP_ENCRYPTION_KEY}

# Google OAuth 2.0
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,https://www.googleapis.com/auth/gmail.modify
app.gmail-redirect-uri=${GMAIL_REDIRECT_URI:http://localhost:8080/api/integrations/gmail/callback}


# Public URL for webhooks
app.public-url=${APP_PUBLIC_URL:https://stupor-enticing-unveiled.ngrok-free.dev}

# Backblaze B2
b2.endpoint=${B2_ENDPOINT:https://s3.eu-central-003.backblazeb2.com}
b2.region=${B2_REGION:eu-central-003}
b2.bucket=${B2_BUCKET:unified-inbox-attachments}
b2.access-key=${B2_ACCESS_KEY}
b2.secret-key=${B2_SECRET_KEY}

# File uploads
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Evolution API
evolution.api.url=${EVOLUTION_API_URL:http://localhost:8081}
evolution.api.key=${EVOLUTION_API_KEY}
evolution.webhook.secret=${EVOLUTION_WEBHOOK_SECRET}
evolution.webhook.url=${EVOLUTION_WEBHOOK_URL:http://host.docker.internal:8080/api/webhooks/whatsapp}
