spring.application.name=unified-inbox

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/unified_inbox
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# Server
server.port=8080

# Tokens
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN}
whatsapp.phone-number-id=1352834727919486
whatsapp.api-version=v25.0
whatsapp.webhook-verify-token=unified-inbox-local-2026
whatsapp.app-secret=${APP_SECRET}
app.encryption.key=${APP_ENCRYPTION_KEY}

# Google OAuth 2.0
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.google.scope=openid,email,https://www.googleapis.com/auth/gmail.modify,https://www.googleapis.com/auth/gmail.send

spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId} 