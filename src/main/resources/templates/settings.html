
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Organization Settings — Unified Inbox</title>

    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/organizations.css}">
    <link rel="stylesheet" th:href="@{/css/settings.css}">
</head>
<body>

<main class="dashboard">

    <header class="dashboard-header">
        <div class="dashboard-brand">
            <div class="dashboard-brand-icon">✉</div>
            <div>
                <h1>Unified Inbox</h1>
                <p>All your messages in one place</p>
            </div>
        </div>

        <form th:action="@{/logout}" method="post">
            <button class="logout-button" type="submit">
                Sign Out
            </button>
        </form>
    </header>

    <section class="settings-content">

        <a class="back-link" th:href="@{/organizations}">
            ← Back to Organizations
        </a>

        <div class="settings-title">
            <h2 th:text="${organization.name}">
                Organization Name
            </h2>

            <p class="settings-description">
                Manage your organization and its members.
            </p>
        </div>

        <div class="settings-panel">
            <h3>Organization Members</h3>

            <div class="member-item"
                 th:each="member : ${members}">

                <div class="member-details">
                    <div class="member-avatar"
                         th:text="${#strings.toUpperCase(#strings.substring(member.username, 0, 1))}">
                        U
                    </div>

                    <span class="member-name"
                          th:text="${member.username}">
                        Username
                    </span>
                </div>

                <span class="member-role"
                      th:text="${member.role}">
                    MEMBER
                </span>

            </div>
        </div>

    </section>
</main>

</body>
</html>
