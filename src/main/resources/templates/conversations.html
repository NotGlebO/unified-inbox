
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Conversations | Unified Inbox</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0f172a;
            color: #e2e8f0;
            font-family: Arial, sans-serif;
        }

        .header {
            height: 76px;
            padding: 18px 24px;
            border-bottom: 1px solid #334155;
        }

        .header a {
            color: #93c5fd;
            text-decoration: none;
            font-size: 14px;
        }

        .header h2 {
            margin: 6px 0 0;
            font-size: 20px;
        }

        .layout {
            display: grid;
            grid-template-columns: 300px minmax(0, 1fr);
            height: calc(100vh - 76px);
        }

        .sidebar {
            border-right: 1px solid #334155;
            overflow-y: auto;
        }

        .conversation {
            padding: 18px;
            border-bottom: 1px solid #334155;
            cursor: pointer;
        }

        .conversation:hover,
        .conversation.active {
            background: #1e293b;
        }

        .conversation-name {
            font-weight: bold;
            margin-bottom: 6px;
        }

        .conversation small {
            color: #94a3b8;
        }

        .main {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .message {
            max-width: 65%;
            width: fit-content;
            padding: 12px 16px;
            margin-bottom: 14px;
            background: #1e293b;
            border-radius: 12px;
            overflow-wrap: anywhere;
        }

        .message.outgoing {
            margin-left: auto;
            background: #1d4ed8;
        }

        .message p {
            margin: 8px 0;
            white-space: pre-wrap;
        }

        .message small {
            color: #cbd5e1;
            font-size: 11px;
        }

        .empty {
            padding: 24px;
            color: #94a3b8;
        }

        @media (max-width: 650px) {
            .layout {
                grid-template-columns: 140px minmax(0, 1fr);
            }

            .message {
                max-width: 95%;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <a th:href="@{/organizations}">← Organizations</a>
    <h2>Conversations</h2>
</header>

<div class="layout">
    <aside class="sidebar" id="conversationList">
        <div class="empty">Loading conversations...</div>
    </aside>

    <main class="main">
        <div class="messages" id="messageList">
            <div class="empty">
                Select a conversation to read messages.
            </div>
        </div>
    </main>
</div>

<script th:inline="javascript">
    const organizationId = /*[[${organizationId}]]*/ 0;
</script>

<script th:src="@{/js/conversations.js}"></script>

</body>
</html>
