
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversations | Unified Inbox</title>
    <link rel="stylesheet" href="/css/conversations.css">
    <script src="/js/conversations.js" defer></script>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="brand">
                <span class="brand-icon">✉</span>
                Unified Inbox
            </div>

            <p class="subtitle">All your messages in one place</p>

            <input
                id="search"
                class="search"
                type="search"
                placeholder="Search conversations..."
                aria-label="Search conversations"
            >
        </div>

        <div class="section-title">Inbox</div>

        <div id="conversationList" class="chat-list">
            <div class="empty">Loading conversations...</div>
        </div>

        <a class="back-link" href="/organizations">
            ← Back to organizations
        </a>
    </aside>

    <main class="main">
        <div
            id="conversationHeader"
            class="conversation-header"
            hidden
        ></div>

        <div id="messageList" class="messages">
            <div class="empty">
                <h2>Welcome 👋</h2>
                <p>Select a conversation on the left to read messages.</p>
            </div>
        </div>

        <div class="composer">
            <input
                id="messageInput"
                placeholder="Select a conversation to reply..."
                disabled
                maxlength="4096"
                aria-label="Message"
            >

            <button id="sendButton" disabled>
                Send ➤
            </button>
        </div>
    </main>
</div>
</body>
</html>
