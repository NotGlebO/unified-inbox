
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unified Inbox</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            background: #0b1120;
            color: #e2e8f0;
        }

        .app {
            display: flex;
            height: 100vh;
            max-width: 1600px;
            margin: auto;
            border-left: 1px solid #243247;
            border-right: 1px solid #243247;
        }

        .sidebar {
            width: 350px;
            min-width: 290px;
            background: #111b2b;
            border-right: 1px solid #29374b;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 26px 20px 20px;
            border-bottom: 1px solid #29374b;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 21px;
            font-weight: 700;
        }

        .brand-icon {
            background: #2563eb;
            padding: 10px;
            border-radius: 12px;
        }

        .subtitle {
            margin: 12px 0 20px;
            color: #94a3b8;
            font-size: 13px;
        }

        .search {
            width: 100%;
            padding: 12px 14px;
            background: #202e42;
            border: 1px solid #334155;
            border-radius: 10px;
            color: white;
            outline: none;
        }

        .search:focus { border-color: #3b82f6; }

        .section-title {
            padding: 20px 20px 10px;
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .chat-list {
            overflow-y: auto;
            flex: 1;
        }

        .chat-item {
            display: flex;
            gap: 12px;
            padding: 16px 18px;
            cursor: pointer;
            border-left: 3px solid transparent;
        }

        .chat-item:hover { background: #1b2a40; }

        .chat-item.active {
            background: #203a60;
            border-left-color: #3b82f6;
        }

        .avatar {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: #315b94;
            color: white;
            font-weight: 700;
        }

        .chat-details {
            flex: 1;
            min-width: 0;
        }

        .chat-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .chat-name {
            font-weight: 600;
            font-size: 14px;
        }

        .chat-time {
            font-size: 11px;
            color: #94a3b8;
            white-space: nowrap;
        }

        .source {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #60a5fa;
            font-size: 11px;
            margin: 5px 0;
        }

        .preview {
            color: #a8b7ca;
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .main {
            display: flex;
            flex: 1;
            min-width: 0;
            flex-direction: column;
            background: #0f1726;
        }

        .conversation-header {
            display: flex;
            align-items: center;
            gap: 12px;
            height: 78px;
            padding: 15px 25px;
            border-bottom: 1px solid #29374b;
            background: #141f30;
        }

        .header-name { font-weight: 600; }

        .header-source {
            color: #60a5fa;
            font-size: 12px;
            margin-top: 5px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .bubble {
            align-self: flex-start;
            max-width: 75%;
            padding: 12px 16px;
            background: #26374e;
            border-radius: 15px 15px 15px 4px;
            overflow-wrap: anywhere;
            line-height: 1.5;
            font-size: 14px;
        }

        .bubble.outgoing {
            align-self: flex-end;
            background: #2563eb;
            border-radius: 15px 15px 4px 15px;
        }

        .bubble-time {
            font-size: 10px;
            color: #b9c8dc;
            text-align: right;
            margin-top: 7px;
        }

        .composer {
            display: flex;
            gap: 12px;
            padding: 20px 25px;
            background: #141f30;
            border-top: 1px solid #29374b;
        }

        .composer input {
            flex: 1;
            min-width: 0;
            background: #26374e;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 14px;
            color: white;
            outline: none;
        }

        .composer button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0 22px;
            font-weight: 600;
            cursor: pointer;
        }

        .composer button:disabled {
            background: #334155;
            color: #94a3b8;
            cursor: not-allowed;
        }

        .empty {
            margin: auto;
            text-align: center;
            color: #94a3b8;
            padding: 30px;
        }

        .empty h2 {
            color: #e2e8f0;
            margin-bottom: 8px;
        }

        .error {
            color: #fca5a5;
            padding: 16px;
            font-size: 13px;
        }

        @media (max-width: 650px) {
            .sidebar { width: 38%; min-width: 145px; }
            .sidebar-header { padding: 16px 10px; }
            .brand { font-size: 15px; }
            .chat-item { padding: 12px 8px; }
            .avatar { width: 34px; height: 34px; }
            .messages { padding: 14px; }
            .conversation-header { padding: 12px; }
            .composer { padding: 12px; }
        }

        .source,
        .header-source {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .source img,
        .header-source img {
            width: 16px;
            height: 16px;
            object-fit: contain;
        }

        .source:has(img[src="/icons/whatsapp.svg"]),
        .header-source:has(img[src="/icons/whatsapp.svg"]) {
            color: #25D366;
        }

    </style>
</head>
<body>

<div class="app">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="brand">
                <span class="brand-icon">✉</span>
                Unified Inbox
            </div>
            <p class="subtitle">Все ваши сообщения в одном месте</p>
            <input id="search" class="search"
                   placeholder="Поиск чатов...">
        </div>

        <div class="section-title">Входящие</div>
        <div id="chatList" class="chat-list"></div>
    </aside>

    <main class="main">
        <div id="conversationHeader" class="conversation-header"
             style="display:none"></div>

        <div id="messages" class="messages">
            <div class="empty">
                <h2>Добро пожаловать 👋</h2>
                <p>Выберите чат слева, чтобы посмотреть переписку.</p>
            </div>
        </div>

        <div class="composer">
            <input id="messageInput"
                   placeholder="Выберите чат для ответа...">
            <button id="sendButton">Отправить ➤</button>
        </div>
    </main>
</div>

<script>
    let chats = [];
    let selectedChat = null;

    const chatList = document.getElementById("chatList");
    const messagesContainer = document.getElementById("messages");
    const header = document.getElementById("conversationHeader");
    const search = document.getElementById("search");

    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");

    let sending = false;

    function formatTime(value) {
        if (!value) return "";
        return new Date(value).toLocaleTimeString("ru-RU", {
            hour: "2-digit",
            minute: "2-digit"
        });
    }

    function createElement(tag, className, text) {
        const element = document.createElement(tag);
        if (className) element.className = className;
        if (text !== undefined) element.textContent = text;
        return element;
    }

    function chatKey(chat) {
        return chat.source + ":" + chat.chatId;
    }

    async function loadChats() {
        try {
            const response = await fetch("/api/chats");
            if (!response.ok) throw new Error("Ошибка загрузки чатов");

            chats = await response.json();
            renderChats();

            if (selectedChat) {
                const updated = chats.find(
                    chat => chatKey(chat) === chatKey(selectedChat)
                );
                if (updated) selectedChat = updated;
            }
        } catch (error) {
            chatList.replaceChildren(
                createElement("div", "error", error.message)
            );
        }
    }

    function renderChats() {
        const query = search.value.trim().toLowerCase();
        chatList.replaceChildren();

        const filtered = chats.filter(chat =>
            chat.sender.toLowerCase().includes(query) ||
            chat.source.toLowerCase().includes(query)
        );

        if (filtered.length === 0) {
            chatList.appendChild(
                createElement("div", "empty", "Чатов пока нет")
            );
            return;
        }

        for (const chat of filtered) {
            const item = createElement("div", "chat-item");

            if (selectedChat && chatKey(chat) === chatKey(selectedChat)) {
                item.classList.add("active");
            }

            const avatar = createElement(
                "div", "avatar", chat.sender.charAt(0).toUpperCase()
            );

            const details = createElement("div", "chat-details");
            const top = createElement("div", "chat-top");
            top.append(
                createElement("span", "chat-name", chat.sender),
                createElement("span", "chat-time",
                    formatTime(chat.lastMessageAt))
            );

            const source = createElement("div", "source");

            const icon = document.createElement("img");
            icon.src = chat.source === "WHATSAPP"
            ? "/icons/whatsapp.svg"
            : "/icons/telegram.svg";
            icon.alt = "Telegram";

            source.append(icon, document.createTextNode(chat.source));

            const preview = createElement(
                "div", "preview", chat.lastMessage
            );

            details.append(top, source, preview);
            item.append(avatar, details);

            item.addEventListener("click", () => selectChat(chat));
            chatList.appendChild(item);
        }
    }

    async function selectChat(chat) {
        selectedChat = chat;
        messageInput.disabled = false;
        sendButton.disabled = false;
        messageInput.focus();
        renderChats();

        header.style.display = "flex";
        header.replaceChildren();

        const avatar = createElement(
            "div", "avatar", chat.sender.charAt(0).toUpperCase()
        );
        const details = createElement("div");

        const headerSource = createElement("div", "header-source");

        const headerIcon = document.createElement("img");
        headerIcon.src = chat.source === "WHATSAPP"
        ? "/icons/whatsapp.svg"
        : "/icons/telegram.svg";
        headerIcon.alt = "Telegram";

        headerSource.append(
            headerIcon,
            document.createTextNode(chat.source)
        );

        details.append(
            createElement("div", "header-name", chat.sender),
            headerSource
        );

        header.append(avatar, details);
        await loadMessages();
    }

    async function loadMessages() {
        if (!selectedChat) return;

        const key = chatKey(selectedChat);

        try {
            const url = "/api/chats/" +
                encodeURIComponent(selectedChat.chatId) +
                "/messages?source=" +
                encodeURIComponent(selectedChat.source);

            const response = await fetch(url);
            if (!response.ok) throw new Error("Ошибка загрузки сообщений");

            const messages = await response.json();

            if (!selectedChat || chatKey(selectedChat) !== key) return;

            const wasNearBottom =
                messagesContainer.scrollHeight -
                messagesContainer.scrollTop -
                messagesContainer.clientHeight < 100;

            messagesContainer.replaceChildren();

            for (const message of messages) {
                const bubble = createElement(
                    "div", "bubble", message.text
                );

                // Позже backend добавит направление сообщения.
                if (message.direction === "OUTGOING") {
                    bubble.classList.add("outgoing");
                }

                bubble.appendChild(
                    createElement(
                        "div",
                        "bubble-time",
                        formatTime(message.receivedAt)
                    )
                );

                messagesContainer.appendChild(bubble);
            }

            if (wasNearBottom) {
                messagesContainer.scrollTop =
                    messagesContainer.scrollHeight;
            }
        } catch (error) {
            messagesContainer.replaceChildren(
                createElement("div", "error", error.message)
            );
        }
    }

    async function sendMessage() {
        if (!selectedChat || sending) return;

        const text = messageInput.value.trim();
        if (!text) return;

        const chat = selectedChat;
        const key = chatKey(chat);

        sending = true;
        sendButton.disabled = true;
        messageInput.disabled = true;

        try {
            const url = "/api/chats/" +
                encodeURIComponent(chat.chatId) +
                "/messages?source=" +
                encodeURIComponent(chat.source);

            const response = await fetch(url, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ text: text })
            });

            if (!response.ok) {
                throw new Error("Не удалось отправить сообщение");
            }

            // Очищаем поле только после успешной отправки.
            if (selectedChat && chatKey(selectedChat) === key) {
                messageInput.value = "";
                await loadMessages();

                messagesContainer.scrollTop =
                    messagesContainer.scrollHeight;
            }

            await loadChats();

        } catch (error) {
            alert(error.message);
        } finally {
            sending = false;
            messageInput.disabled = !selectedChat;
            sendButton.disabled = !selectedChat;
            if (selectedChat) messageInput.focus();
        }
    }
    sendButton.addEventListener("click", sendMessage);

    messageInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    });

    search.addEventListener("input", renderChats);

    loadChats();
    setInterval(async () => {
        await loadChats();
        await loadMessages();
    }, 3000);
</script>

</body>
</html>
