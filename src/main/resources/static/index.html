
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unified Inbox — Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<main class="auth-page">
    <div class="auth-container">

        <div class="brand">
            <div class="brand-icon">✉</div>
            <h1>Unified Inbox</h1>
        </div>

        <p class="subtitle">
            Все ваши сообщения в одном месте
        </p>

        <div class="auth-card">

            <h2 id="formTitle">Вход в аккаунт</h2>

            <p class="auth-description" id="formDescription">
                Введите данные для входа
            </p>

            <form id="authForm">

                <div class="form-group">
                    <label for="username">Логин</label>
                    <input
                        id="username"
                        name="username"
                        type="text"
                        placeholder="Введите логин"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Введите пароль"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button class="primary-button" id="submitButton" type="submit">
                    Войти
                </button>

            </form>

            <p class="message" id="message" role="status"></p>

            <div class="switch-auth">
                <span id="switchText">Нет аккаунта?</span>
                <button type="button" id="switchButton">
                    Зарегистрироваться
                </button>
            </div>

        </div>
    </div>
</main>

<script src="/js/auth.js"></script>

</body>
</html>
